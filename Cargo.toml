[package]
name = "ai_digital"
version = "0.7.0"
edition = "2021"
description = "AI-driven RTL generation, simulation, and synthesis tool"

[dependencies]
colored = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
dirs = "5"
libc = "0.2"

[build-dependencies]
cmake = "0.1"

[profile.release]
opt-level = 1
